name: Update TI 2026 data

# Runs the updater on a schedule and commits any data.json changes.
# Also runnable on demand from the Actions tab (workflow_dispatch).

on:
  # There is deliberately NO `schedule:` here any more.
  #
  # GitHub's schedule trigger is best-effort and gets deprioritised on public
  # repos: it dropped two consecutive hours on TI opening night, and both the
  # 07:00 and 07:15 slots on day two. Supabase pg_cron drives both runs instead
  # and dispatches this workflow, which fires immediately - measured 1 second
  # from tick to job start:
  #
  #   pg_cron full-tick   0 * * * *         -> updater-watchdog?full=1 -> mode=full
  #   pg_cron score-tick  15,30,45 * * * *  -> updater-watchdog?fast=1 -> mode=fast
  #
  # updater-watchdog also still checks data.json staleness every 10 minutes and
  # re-dispatches a full run if it drifts past 45 minutes.
  workflow_dispatch:
    inputs:
      mode:
        description: "full = Liquipedia + ranking + commit; fast = scores only"
        type: choice
        options: [full, fast]
        default: full

# Allow the workflow to push the updated data.json back to the repo.
permissions:
  contents: write

concurrency:
  group: ti-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run updater
        env:
          LIQUIPEDIA_CONTACT: ${{ vars.LIQUIPEDIA_CONTACT || 'set-your-contact@example.com' }}
          OPENDOTA_LEAGUE_ID: ${{ vars.OPENDOTA_LEAGUE_ID || '' }}
          OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY || '' }}
          # League backend: finished results feed the prediction leaderboard.
          SUPABASE_URL: https://hqpynfzatnmwvlxdfhsw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          FAST: ${{ inputs.mode == 'fast' && '1' || '' }}
        run: |
          if [ -n "$FAST" ]; then
            python update_data.py --fast
          else
            python update_data.py
          fi

      # Both runs may publish, but only when data.json actually changed.
      #
      # The fast pass rewrites the file ONLY when a pairing or kick-off time
      # moved - never for scores alone - so this step is a no-op on most fast
      # runs and there is no flood of commits. That is deliberate: new pairings
      # used to wait for the hourly run and reached the site after the match had
      # already started, leaving no window to predict in.
      - name: Commit changes if data changed
        run: |
          git config user.name  "ti-data-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "No data changes."
            exit 0
          fi
          git add data.json
          git commit -m "data: auto-update $(date -u +'%Y-%m-%dT%H:%MZ')"
          # Anything landing on main between checkout and push - a human commit,
          # or an overlapping run - makes this a non-fast-forward and the push is
          # rejected. That silently DISCARDED the refreshed data.json: the job
          # went red but the next run just started over from stale data. Rebase
          # onto whatever is on the remote now and try again.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed updated data.json (attempt $attempt)"
              exit 0
            fi
            echo "Push rejected, rebasing onto origin/main and retrying..."
            git pull --rebase --autostash origin main || break
            sleep 3
          done

          # Losing the race is not a failure IF someone else already published
          # data at least as fresh as ours. Two runs can start in the same second
          # when pg_cron jobs coincide on the hour; both fetch, both commit, one
          # wins. Failing the loser sent a red build email for a job that did
          # exactly what it was meant to do, and a red build nobody trusts is how
          # a real failure gets missed. A genuinely stuck push still fails.
          git fetch origin main --quiet || true
          ours=$(git show HEAD:data.json 2>/dev/null | python -c "import json,sys;print(json.load(sys.stdin)['meta']['lastUpdated'])" 2>/dev/null || echo "")
          theirs=$(git show origin/main:data.json 2>/dev/null | python -c "import json,sys;print(json.load(sys.stdin)['meta']['lastUpdated'])" 2>/dev/null || echo "")
          echo "ours=$ours  origin=$theirs"
          if [ -n "$theirs" ] && [ -n "$ours" ] && [ "$theirs" \> "$ours" -o "$theirs" = "$ours" ]; then
            echo "Another run published data at least as fresh ($theirs). Nothing lost — not a failure."
            exit 0
          fi
          echo "Could not push data.json, and origin has nothing newer. This one is real."
          exit 1

  # Ask production whether it still works.
  #
  # This exists because on 15 Aug 2026, mid-tournament, four URLs under /en/
  # had been 404 for days while all eighteen test files passed. They all read
  # the repo; none of them can prove a URL answers. The user found it by
  # clicking a link, which is the one detector nobody should be relying on.
  #
  # It hangs off the updater rather than a `schedule:` trigger for the reason
  # documented at the top of this file: GitHub's cron is best-effort and got
  # deprioritised on this repo. pg_cron drives the updater every 15 minutes, so
  # piggybacking gives a reliable heartbeat for free.
  #
  # `if: always()` — a failed data update is exactly when it is most worth
  # asking whether the site is still standing.
  verify-production:
    needs: update
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      # No install: the checker is dependency-free on purpose, so a broken
      # lockfile can never be the reason production goes unwatched.
      - name: Ask production whether it works
        run: node tools/check_production.js
