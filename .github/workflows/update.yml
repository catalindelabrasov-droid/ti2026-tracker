name: Update TI 2026 data

# Runs the updater on a schedule and commits any data.json changes.
# Also runnable on demand from the Actions tab (workflow_dispatch).

on:
  schedule:
    # Full run, hourly: Liquipedia structure + rosters + world ranking, and the
    # only trigger that commits data.json. Stays polite to Liquipedia.
    #
    # There is deliberately NO quarter-hour schedule here. GitHub's `schedule`
    # trigger is best-effort and gets deprioritised on public repos: it dropped
    # two consecutive hours on TI opening night, and both the 07:00 and 07:15
    # slots on day two. The 15-minute scoring pass is driven from Supabase
    # pg_cron instead, which calls updater-watchdog?fast=1 and dispatches this
    # workflow with mode=fast. workflow_dispatch fires immediately, so the
    # reliable timer keeps the clock and GitHub only runs the job.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = Liquipedia + ranking + commit; fast = scores only"
        type: choice
        options: [full, fast]
        default: full

# Allow the workflow to push the updated data.json back to the repo.
permissions:
  contents: write

concurrency:
  group: ti-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run updater
        env:
          LIQUIPEDIA_CONTACT: ${{ vars.LIQUIPEDIA_CONTACT || 'set-your-contact@example.com' }}
          OPENDOTA_LEAGUE_ID: ${{ vars.OPENDOTA_LEAGUE_ID || '' }}
          OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY || '' }}
          # League backend: finished results feed the prediction leaderboard.
          SUPABASE_URL: https://hqpynfzatnmwvlxdfhsw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          FAST: ${{ inputs.mode == 'fast' && '1' || '' }}
        run: |
          if [ -n "$FAST" ]; then
            python update_data.py --fast
          else
            python update_data.py
          fi

      # Only the full run publishes. A fast run has nothing to commit - it
      # writes to Supabase, not to the repo - and committing every 15 minutes
      # would mean 96 deploys a day for a file the page already corrects live.
      - name: Commit changes if data changed
        if: ${{ inputs.mode != 'fast' }}
        run: |
          git config user.name  "ti-data-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- data.json; then
            git add data.json
            git commit -m "data: auto-update $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
            echo "Pushed updated data.json"
          else
            echo "No data changes."
          fi
