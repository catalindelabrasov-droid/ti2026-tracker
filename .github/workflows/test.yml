# Run the test suite on every push and pull request.
#
# WHY THIS EXISTS
#
# Until now nothing ran these. `.github/workflows/` held only update.yml, the
# data updater, so `npm test` executed exactly when somebody remembered to type
# it. A suite nobody runs is documentation, not a safety net — and this repo
# deployed straight to a live tournament from `main`.
#
# It is deliberately NOT a deploy gate. Netlify builds from main independently,
# and blocking a data-updater commit behind a test run would stall the 15-minute
# refresh during a live event. This tells you something broke; it does not stop
# the site updating.
name: tests

# Least privilege, stated in the file rather than inherited.
# update.yml declares `contents: write` because it pushes data.json; this job
# only reads, and leaving the block out meant GITHUB_TOKEN took whatever the
# repository default happened to be — a setting, not a decision.
permissions:
  contents: read

on:
  push:
    branches: [main, "ru-i18n"]
    # The updater commits data.json every ~15 minutes. Those runs would drown
    # out real signal and burn Actions minutes for no benefit.
    paths-ignore:
      - "data.json"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # jsdom is a devDependency; without it several files exit 1 by design
      # rather than skipping, so this step is not optional.
      #
      # --ignore-scripts: run-all.js DISCOVERS tools/test_*.js and spawns each
      # one, so any pull request is already code execution in CI. That is
      # deliberate — it is how a new test gets run — but it means the dependency
      # tree should not ALSO be allowed to run lifecycle scripts on top of it.
      - name: Install
        run: npm install --no-audit --no-fund --ignore-scripts

      # test_pick_series.py guards _pick_series in update_data.py — the code
      # that rewrites data.json in production. run-all.js reports SKIP loudly if
      # python is absent, so make sure it is not.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test
        run: npm test
