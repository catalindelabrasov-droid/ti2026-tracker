# Netlify deploy config for dota2tileague.com
# The site is static (repo root). The build command only strips files that
# must never be public: test_no_login.html bypasses the login screen and is
# for local testing only (see docs 06/07).
[build]
  publish = "."
  # publish = "." serves the ENTIRE repo root, so anything committed is a public
  # URL unless it is stripped here. test_no_login.html bypasses the login screen
  # and is for local testing only (see docs 06/07).
  #
  # The rest are build-time and test-time files with no business being served:
  # i18n/ holds the extraction notes and traffic figures, tools/ holds the test
  # suites, and ru/build-pages.js generates the Russian prose pages. The Russian
  # pages themselves and ru/strings.json are runtime files and stay.
  # supabase/ is stripped because it is an attack map, not because it holds
  # secrets — it holds none. But it publishes every RLS policy, every grant, and
  # config.toml's list of which functions skip JWT verification. Worse,
  # 0024_ladder_settle_lockdown.sql is a written description of a privilege hole
  # with before/after ACLs, and push-tick/index.ts shows the header that gates it
  # and that the gate fails open when the variable is empty. None of that is
  # needed at runtime: edge functions are deployed separately, and update_data.py
  # runs from a checkout in Actions, not from the deploy.
  #
  # update.yml at the root is a stale duplicate of .github/workflows/update.yml
  # (dot-directories are already excluded) and still carries the old schedule.
  command = "rm -f test_no_login.html && rm -rf i18n tools email-templates supabase && rm -f ru/build-pages.js update.yml *.py *.md"

# Russian lives at /ru/ and is the SAME document, localised in the browser —
# not a second copy of index.html that would drift out of sync within a week.
# Real files under ru/ (guide, legal, delete-account, strings.json) are served
# directly: Netlify prefers an existing file over a non-forced rewrite, so the
# rules below only catch the paths that have no file behind them.
#
# ONE rule, deliberately. Netlify's matcher ignores the trailing slash, so
# `from = "/ru/"` already answers both /ru and /ru/ — and an extra
# `from = "/ru" -> "/ru/"` 301 would match /ru/ as well and redirect it to
# itself forever, which is exactly what a first draft of this file did.
#
# Because both spellings are served, the page cannot rely on relative links
# resolving inside /ru/; the Russian build emits absolute /ru/… paths instead.
[[redirects]]
  from = "/ru/"
  to = "/index.html"
  status = 200

# The English escape hatch. /en/ is the SAME document as / and is never
# geo-redirected, so a reader in a Russian-speaking country who wants English
# has somewhere to land that will not bounce them straight back. The "English"
# link on every /ru/ page points here.
#
# It must be a separate PATH, not a query flag: the geo rule below fires
# server-side before any script runs, so localStorage and cookies cannot be
# consulted, and a "/?en=1" would still have to out-match a rule on "/".
[[redirects]]
  from = "/en/"
  to = "/index.html"
  status = 200

# Send visitors from Russian-speaking countries to /ru/.
#
# force = true is REQUIRED and is the one place this file uses it: index.html is
# a real file at "/", and Netlify serves a real file in preference to any
# non-forced rule, so without it this rule would simply never fire.
#
# 302, not 301. A 301 is cached by the browser forever — a reader who later
# wants English, or who is travelling, would be stuck with no way to clear it.
#
# Googlebot is unaffected without any special handling: it crawls from the US,
# so it never matches Country and always indexes the English page at "/". That
# was the objection to auto-redirecting, and geo-conditioning removes it.
#
# Only "/" is redirected. Deep links (/guide.html, /watch.html) are left alone
# so a shared URL always opens the page it points at.
#
# UA and GE are deliberately NOT in this list — see the note in the commit.
[[redirects]]
  from = "/"
  to = "/ru/"
  status = 302
  force = true
  conditions = {Country = ["RU", "BY", "KZ", "KG", "TJ", "UZ", "TM", "AM", "AZ", "MD"]}

[[redirects]]
  from = "/ru/index.html"
  to = "/index.html"
  status = 200

# Not translated yet — the watch page is almost entirely team names, scores and
# embedded streams. Serving the English one keeps the link working.
[[redirects]]
  from = "/ru/watch.html"
  to = "/watch.html"
  status = 200

# The service worker must never be served from cache. If it is, a stale worker
# keeps serving a stale app and no deploy can dislodge it.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Fonts never change under a given filename — a new weight or subset would be a
# new file. So they can be held for a year, which is the whole point of serving
# them ourselves rather than paying two extra handshakes to Google on every
# cold visit.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Digital Asset Links, so the Android wrapper is trusted by this domain and
# opens without a browser address bar.
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
